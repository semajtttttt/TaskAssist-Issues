name: Issue
about: Report a bug, request a feature, or track a task.
body:
  - type: dropdown
    id: type
    attributes:
      label: Type
      options:
        - Bug
        - Feature request
        - Improvement
        - Task
        - Question
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is this issue about, in a sentence or two?
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: For bugs, the steps to reproduce. For features or tasks, what needs to be done and why.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: What should happen, or what "done" looks like.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: What happens instead (bugs only).
  - type: input
    id: version
    attributes:
      label: Version / environment
      placeholder: e.g. app version, OS, browser
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - Low
        - Medium
        - High
        - Urgent
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Logs, screenshots, links. Drag and drop files here.
